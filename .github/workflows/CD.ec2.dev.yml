name: Deploy to Amazon EC2

on:
  push:
    branches: ['~~']

# ECS 워크플로우와 동일하게 환경변수 설정
env:
  AWS_REGION: ap-northeast-2
  # 추가적으로 필요한 환경변수들을 여기에 정의할 수 있습니다.

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies and build
        run: |
          yarn
          yarn run build

      - name: Create zip file
        run: zip -r deploy.zip . -x "node_modules/*" ".git/*" ".github/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Copy file to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }} # 예: 13.125.123.123 또는 도메인
          username: ${{ secrets.EC2_USERNAME }} # 예: ubuntu, ec2-user
          key: ${{ secrets.EC2_PRIVATE_KEY }} # EC2 접속용 프라이빗 키
          port: 22
          source: 'deploy.zip'
          target: '/home/ubuntu' # EC2에 파일이 저장될 경로

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            # 기존 앱 디렉토리가 없다면 생성
            mkdir -p /home/ubuntu/app
            # 압축 해제 (기존 파일을 덮어쓰며)
            unzip -o /home/ubuntu/deploy.zip -d /home/ubuntu/app
            # 압축 파일 삭제
            rm /home/ubuntu/deploy.zip
            # 애플리케이션 디렉토리로 이동
            cd /home/ubuntu/app
            yarn
            pm2 reload || yarn start:dev
